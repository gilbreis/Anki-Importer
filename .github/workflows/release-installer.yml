name: Release Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "local-importer/**"
      - "installer/**"
      - "assets/**"
      - ".github/workflows/release-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r local-importer/requirements.txt

      - name: Build application icon
        run: python local-importer/build_icon.py

      - name: Build local importer EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name AnkiImporter `
            --icon artifacts/anki-importer.ico `
            local-importer/app.py

          New-Item -ItemType Directory -Force -Path artifacts/local-importer | Out-Null
          Copy-Item dist/AnkiImporter.exe artifacts/local-importer/AnkiImporter.exe

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e -s winget --accept-package-agreements --accept-source-agreements

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe")
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }

          if ([string]::IsNullOrWhiteSpace($iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          & $iscc `
            "/DImporterSource=$((Resolve-Path 'artifacts/local-importer/AnkiImporter.exe').Path)" `
            "/DIconSource=$((Resolve-Path 'artifacts/anki-importer.ico').Path)" `
            "installer/AnkiImporter.iss"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item installer/output/AnkiImporterSetup.exe artifacts/release/AnkiImporterSetup.exe

      - name: Publish latest installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "artifacts/release/AnkiImporterSetup.exe"
          if (gh release view latest --repo "${{ github.repository }}" *> $null) {
            gh release upload latest $asset --clobber --repo "${{ github.repository }}"
            gh release edit latest `
              --repo "${{ github.repository }}" `
              --title "Anki Importer - Última versão" `
              --notes "Instalador mais recente do Anki Importer para Windows. Esta release é atualizada automaticamente."
          }
          else {
            gh release create latest $asset `
              --repo "${{ github.repository }}" `
              --target main `
              --title "Anki Importer - Última versão" `
              --notes "Instalador mais recente do Anki Importer para Windows. Esta release é atualizada automaticamente."
          }
