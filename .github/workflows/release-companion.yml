name: Release Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        shell: pwsh
        run: pip install -r local-importer/requirements.txt

      - name: Build local importer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/local-importer | Out-Null
          pyinstaller `
            --onefile `
            --windowed `
            --name AnkiImporter `
            --distpath artifacts/local-importer `
            --workpath artifacts/pyinstaller-work `
            --specpath artifacts `
            local-importer/app.py

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e -s winget --accept-package-agreements --accept-source-agreements

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe")
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }

          if ([string]::IsNullOrWhiteSpace($iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          & $iscc `
            "/DImporterSource=$((Resolve-Path 'artifacts/local-importer/AnkiImporter.exe').Path)" `
            "installer/AnkiImporter.iss"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item installer/output/AnkiImporterSetup.exe artifacts/release/AnkiImporterSetup.exe

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/release/AnkiImporterSetup.exe `
            --repo "${{ github.repository }}" `
            --title "Anki Importer ${{ github.ref_name }}" `
            --generate-notes
