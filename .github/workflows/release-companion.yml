name: Release Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production server URL
        shell: pwsh
        env:
          ANKI_SERVER_URL: ${{ vars.ANKI_SERVER_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANKI_SERVER_URL)) {
            throw "Repository variable ANKI_SERVER_URL is required before creating a public installer release."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Companion
        shell: pwsh
        run: |
          dotnet publish desktop-companion/AnkiImporter.Companion/AnkiImporter.Companion.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/companion

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e -s winget --accept-package-agreements --accept-source-agreements

      - name: Build Setup.exe
        shell: pwsh
        env:
          ANKI_SERVER_URL: ${{ vars.ANKI_SERVER_URL }}
        run: |
          $iscc = "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          & $iscc `
            "/DCompanionSource=$((Resolve-Path 'artifacts/companion/AnkiImporter.Companion.exe').Path)" `
            "/DServerUrl=$env:ANKI_SERVER_URL" `
            "installer/AnkiImporter.iss"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item installer/output/AnkiImporterSetup.exe artifacts/release/AnkiImporterSetup.exe

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/release/AnkiImporterSetup.exe `
            --repo "${{ github.repository }}" `
            --title "Anki Importer ${{ github.ref_name }}" `
            --generate-notes
