name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "desktop-companion/**"
      - ".github/workflows/build-installer.yml"
  pull_request:
    paths:
      - "installer/**"
      - "desktop-companion/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Companion
        shell: pwsh
        run: |
          dotnet publish desktop-companion/AnkiImporter.Companion/AnkiImporter.Companion.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/companion

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e -s winget --accept-package-agreements --accept-source-agreements

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          $roots = @(
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)},
            $env:LOCALAPPDATA
          ) | Where-Object { $_ -and (Test-Path $_) }

          $iscc = Get-ChildItem -Path $roots -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          Write-Host "Using Inno Setup compiler: $iscc"

          & $iscc `
            "/DCompanionSource=$((Resolve-Path 'artifacts/companion/AnkiImporter.Companion.exe').Path)" `
            "installer/AnkiImporter.iss"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiImporterSetup-win-x64
          path: installer/output/AnkiImporterSetup.exe
          if-no-files-found: error
          retention-days: 14
