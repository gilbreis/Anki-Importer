name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "local-importer/**"
      - "anki-addon/**"
      - "assets/**"
      - ".github/workflows/build-installer.yml"
  pull_request:
    paths:
      - "installer/**"
      - "local-importer/**"
      - "anki-addon/**"
      - "assets/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: pip install -r local-importer/requirements.txt

      - name: Build application icon
        shell: pwsh
        run: python local-importer/build_icon.py

      - name: Build local importer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/local-importer | Out-Null
          $icon = (Resolve-Path "artifacts/anki-importer.ico").Path

          pyinstaller `
            --onefile `
            --windowed `
            --name AnkiImporter `
            --icon "$icon" `
            --distpath artifacts/local-importer `
            --workpath artifacts/pyinstaller-work `
            --specpath artifacts `
            local-importer/app.py

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "artifacts/local-importer/AnkiImporter.exe")) {
            throw "AnkiImporter.exe was not generated."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e -s winget --accept-package-agreements --accept-source-agreements

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe")
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }

          if ([string]::IsNullOrWhiteSpace($iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          & $iscc `
            "/DImporterSource=$((Resolve-Path 'artifacts/local-importer/AnkiImporter.exe').Path)" `
            "/DIconSource=$((Resolve-Path 'artifacts/anki-importer.ico').Path)" `
            "installer/AnkiImporter.iss"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiImporterSetup-win-x64
          path: installer/output/AnkiImporterSetup.exe
          if-no-files-found: error
          retention-days: 14
