name: Build Windows Companion

on:
  push:
    branches: [main]
    paths:
      - "desktop-companion/**"
      - ".github/workflows/build-companion.yml"
  pull_request:
    paths:
      - "desktop-companion/**"
      - ".github/workflows/build-companion.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop-companion/AnkiImporter.Companion/AnkiImporter.Companion.csproj

      - name: Build
        run: dotnet build desktop-companion/AnkiImporter.Companion/AnkiImporter.Companion.csproj --configuration Release --no-restore

      - name: Publish single-file Windows executable
        run: >-
          dotnet publish desktop-companion/AnkiImporter.Companion/AnkiImporter.Companion.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/companion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiImporter-Companion-win-x64
          path: artifacts/companion/**
          if-no-files-found: error
          retention-days: 14
